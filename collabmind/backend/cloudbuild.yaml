steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/collabmind-backend:$COMMIT_SHA', '.']
    dir: 'backend'

  # 2. Push the image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/collabmind-backend:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'collabmind-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/collabmind-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,VERTEX_AI_LOCATION=us-central1,ENVIRONMENT=production'

images:
  - 'gcr.io/$PROJECT_ID/collabmind-backend:$COMMIT_SHA'
